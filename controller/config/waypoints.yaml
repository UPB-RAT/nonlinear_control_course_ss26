drone_controller:
  ros__parameters:

    robot_name: "bebop1"
    control_rate: 50.0
    takeoff_height: 1.0
    xy_tolerance: 0.15
    z_tolerance:  0.10
    yaw_tolerance: 0.10
    max_linear_vel:   1.5
    max_vertical_vel: 1.0
    max_yaw_rate:     1.0

    waypoints: [
      0.0, 0.0, 1.0, 0.0,
    ]

    pid_x.kp:   0.8
    pid_x.ki:   0.05
    pid_x.kd:   0.5
    pid_y.kp:   0.8
    pid_y.ki:   0.05
    pid_y.kd:   0.5
    pid_z.kp:   1.2
    pid_z.ki:   0.10
    pid_z.kd:   0.5
    pid_yaw.kp: 1.0
    pid_yaw.ki: 0.01
    pid_yaw.kd: 0.1